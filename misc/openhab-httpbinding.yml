        label: Operating Mode
        config:
          stateTransformation:
            - "JINJA:{{ value_json.items[\"SYS\"][\"0\"][\"274\"].value }}"
          commandExtension: /SYS/0/274
          mode: READWRITE
      "374_AUTO":
        type: switch
        label: "Betriebsstatus: Automatik"
        config:
          stateTransformation:
            - "JINJA:{{ value_json.items[\"SYS\"][\"0\"][\"374\"].value.AUTO }}"
          onValue: "true"
          offValue: "false"
          mode: READONLY
      "374_COMPR":
