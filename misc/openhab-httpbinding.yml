version: 1
things:
  http:url:can-wifi-gw-heatpump:
    label: Stiebel Eltron LWZ 5S Plus
    config:
      authMode: BASIC
      ignoreSSLErrors: false
      baseURL: http://<deviceAddress>/api/data
      delay: 0
      stateMethod: GET
      refresh: 30
      commandMethod: PUT
      contentType: text/plain
      timeout: 3000
      bufferSize: 2048
    channels:
      last-failure:
        type: request-date-time
        label: Last Failure
      last-success:
        type: request-date-time
        label: Last Success
      "13":
        type: number
        label: Vorlauftemperatur
        config:
          stateTransformation:
            - "JINJA:{{value_json.items[\"SYS\"][\"0\"][\"13\"].value + \" \" + value_json.items[\"SYS\"][\"0\"][\"13\"].unit}}"
          mode: READONLY
      "22":
        type: number
        label: Rücklauftemperatur
        config:
          stateTransformation:
            - "JINJA:{{value_json.items[\"SYS\"][\"0\"][\"22\"].value + \" \" + value_json.items[\"SYS\"][\"0\"][\"22\"].unit}}"
          mode: READONLY
      "14":
        type: number
        label: Warmwasser Temperatur
        config:
          stateTransformation:
            - "JINJA:{{value_json.items[\"SYS\"][\"0\"][\"14\"].value + \" \" + value_json.items[\"SYS\"][\"0\"][\"14\"].unit}}"
          mode: READONLY
      "474":
        type: number
        label: Volumenstrom
        config:
          stateTransformation:
            - "JINJA:{{value_json.items[\"SYS\"][\"0\"][\"474\"].value + \" \" + value_json.items[\"SYS\"][\"0\"][\"474\"].unit}}"
          mode: READONLY
      "3":
